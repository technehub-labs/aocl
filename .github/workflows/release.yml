name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/smoke/bin/aocl-score --self-test
          /tmp/smoke/bin/aocl-realization --self-test
          /tmp/smoke/bin/aocl-ledger --self-test
          /tmp/smoke/bin/aocl-model --self-test
          /tmp/smoke/bin/aocl-score 3 4 2 --velocity slow
          /tmp/smoke/bin/aocl-realization --E 0.6 --C 0.8 --Vd 0.9
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: windows-latest, arch: x86_64 }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check .
          python -m pip install --disable-pip-version-check pyinstaller
      - name: Build one-file binaries
        run: |
          pyinstaller --onefile --clean --name aocl-score src/aocl/assess.py
          pyinstaller --onefile --clean --name aocl-realization src/aocl/realization.py
          pyinstaller --onefile --clean --name aocl-ledger src/aocl/ledger.py
          pyinstaller --onefile --clean --name aocl-model src/aocl/model.py
      - name: Gate — self-test each binary
        shell: bash
        run: |
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          ./dist/aocl-score$EXT --self-test
          ./dist/aocl-realization$EXT --self-test
          ./dist/aocl-ledger$EXT --self-test
          ./dist/aocl-model$EXT --self-test
      - name: Platform-suffixed names
        shell: bash
        run: |
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          SUFFIX="${{ matrix.os == 'macos-latest' && 'macos-arm64' || (runner.os == 'Linux' && 'linux-x86_64' || 'windows-x86_64') }}"
          mkdir out
          for bin in aocl-score aocl-realization aocl-ledger aocl-model; do
            cp "dist/${bin}${EXT}" "out/${bin}-${SUFFIX}${EXT}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: out/

  publish:
    runs-on: ubuntu-latest
    needs: [build-python, binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Prepare release assets
        run: |
          find release-assets -maxdepth 1 -type f ! -name '*.exe' ! -name '*.whl' ! -name '*.tar.gz' -exec chmod +x {} +
          cd release-assets && find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt && cd ..
      - name: Extract release notes from the changelog
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          version = "${GITHUB_REF_NAME#v}" if False else "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[v?{re.escape(version)}\].*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for v{version}")
          pathlib.Path("notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --notes-file notes.md
