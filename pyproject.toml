[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aocl"
version = "0.1.2"
description = "Autonomous Operations & Closed Loops: closed-loop automation maturity assessment (L1-L5 across three vectors), the informative realization heuristic, loop velocity taxonomy, and CLAM-aligned loop modeling. Formalizes the AOCL foundational research corpus on Autonomous Operations and Closed Loops (v1.2.0)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AOCL maintainers" }]
keywords = ["autonomous-operations", "closed-loop", "maturity-model", "automation", "autonomy", "aocl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Office/Business",
]
dependencies = ["pyyaml>=5.4"]

[project.urls]
Homepage = "https://github.com/technehub-labs/aocl"
Issues = "https://github.com/technehub-labs/aocl/issues"
Documentation = "https://github.com/technehub-labs/aocl/tree/main/docs"
Loop-format = "https://github.com/emmanuel-a-otchere/Closed-Loop-Management"
Related-method = "https://github.com/emmanuel-a-otchere/measuring-and-managing-autonomy"

[project.scripts]
aocl-score = "aocl.assess:main"
aocl-realization = "aocl.realization:main"
aocl-ledger = "aocl.ledger:main"
aocl-model = "aocl.model:main"
aocl-metamodel = "aocl.metamodel:main"
aocl-behavior-spec = "aocl.behavior_spec:main"
aocl-control-contract = "aocl.control_contract:main"
aocl-evidence = "aocl.evidence_model:main"
aocl-scenario = "aocl.scenario:main"

[project.optional-dependencies]
dev = ["jsonschema>=4.21", "build", "pyinstaller"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
