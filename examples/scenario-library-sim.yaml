# AOCL Scenario Library — sim-canvas skeletons (migrated per AOCL-CR-009 §24 / AOCL-CR-012)
#
# Generated by: aocl-scenario --migrate model/behavior.yaml
# The four engine-embedded sim-canvas scenarios (baseline/drift/fastdist/quiet) as Draft scenario
# skeletons: known modes → Periodic disturbances (controller-known), novel spikes → Random (hidden
# from the controller, distribution carried), drift → Ramp. Hard-coded engine behavior is inventoried
# in each scenario's migrationNotes. This is the state-based engine's reference scenario library.
schemaVersion: '0.1'
modelVersion: 1.0.0
scenarioLibrary:
  id: urn:aocl:scenarios:sim-canvas
  type: ScenarioLibrary
  name: Sim-canvas scenario skeletons
  definition: Draft scenarios migrated from the simulation canvas's engine-embedded configuration (CR-009
    §24).
  closedLoopRef:
    loopId: urn:aocl:loop:service-assurance-001
    sourceSystem: sim-canvas migration
  contexts:
  - contextId: ctx-sim-canvas
    domain: AOCL simulation canvas
    environment: state-based deterministic simulation, seeded
  scenarios:
  - scenarioId: SCN-SIM-BASELINE-001
    scenarioType: Normal
    name: 'Sim-canvas scenario: baseline'
    definition: Carried from the simulation canvas 'baseline' scenario (engine-embedded configuration
      surfaced per §24).
    version: 0.1.0
    lifecycleStatus: Draft
    contextRef: ctx-sim-canvas
    modelRefs:
      closedLoopRefs:
      - urn:aocl:loop:service-assurance-001
    modelVersionRefs:
    - aocl-sim 1.0.0 (informative mapping under test)
    initialConditions:
      method: Defaulted
      states:
      - initialStateId: is-baseline-plant
        subjectRef: network-service
        stateVariableRef: svc-latency
        value: 0.0
        valueType: numeric
        unit: signal units
        stateClass: Actual
        initializationMethod: Defaulted
        sourceRef: model/behavior.yaml plant.x_initial
    parameters:
    - parameterId: p-horizon
      name: Horizon
      definition: Simulation horizon in ticks.
      valueType: numeric
      value: 3000
      unit: ticks
      variationMode: Fixed
      allowedRange:
        min: 1
        max: 100000
    - parameterId: p-noise
      name: Environment noise
      definition: Plant noise sigma.
      valueType: numeric
      value: 1.0
      unit: sigma
      variationMode: Fixed
      allowedRange:
        min: 0
        max: 100
    - parameterId: p-tolerance
      name: Excursion tolerance
      definition: Excursion threshold.
      valueType: numeric
      value: 3.0
      unit: signal units
      variationMode: Fixed
      allowedRange:
        min: 0
        max: 1000
    disturbances:
    - disturbanceId: d-mode-a
      disturbanceType: Demand
      name: Known mode A
      definition: Recurring demand spike carried from behavior.yaml known_modes (period 420 ticks).
      targetRefs:
      - network-service
      magnitude: 26.0
      magnitudeUnit: signal units
      onset:
        basis: Periodic
        every: 420
      duration: 6 ticks
      profile:
        kind: Periodic
      effect:
        variableRef: svc-latency
        effect: impulse added to plant state
      knownToController: true
    - disturbanceId: d-mode-b
      disturbanceType: Demand
      name: Known mode B
      definition: Recurring demand spike carried from behavior.yaml known_modes (period 730 ticks).
      targetRefs:
      - network-service
      magnitude: 17.0
      magnitudeUnit: signal units
      onset:
        basis: Periodic
        every: 730
      duration: 4 ticks
      profile:
        kind: Periodic
      effect:
        variableRef: svc-latency
        effect: impulse added to plant state
      knownToController: true
    - disturbanceId: d-novel
      disturbanceType: Demand
      name: Novel one-shot demand spike
      definition: One-shot unique-signature spikes at rate 6.0/1000 ticks, magnitude range carried from
        behavior.yaml.
      targetRefs:
      - network-service
      magnitude: '[15.0, 30.0]'
      magnitudeUnit: signal units
      onset:
        basis: Random
        at: rate-scheduled
      duration: 3-8 ticks
      profile:
        kind: Random
        distributionRef: uniform rate 6.0/1000 ticks; magnitude uniform in [15.0, 30.0] (carried from
          behavior.yaml)
      effect:
        variableRef: svc-latency
        effect: impulse added to plant state
      knownToController: false
    - disturbanceId: d-drift
      disturbanceType: Demand
      name: Slow demand drift
      definition: Slow ramp from tick 1200 to 2400, total magnitude 18.0.
      targetRefs:
      - network-service
      magnitude: 18.0
      magnitudeUnit: signal units
      onset:
        basis: RelativeTime
        at: 1200
      duration: 2400 - 1200 ticks
      profile:
        kind: Ramp
      effect:
        variableRef: svc-latency
        effect: gradual offset added to plant state
      knownToController: false
    events:
    - eventId: ev-baseline-start
      eventType: ScenarioStart
      name: Scenario start
      trigger:
        basis: RelativeTime
        at: 0
      subjectRef: network-service
      ordering: Independent
    assumptions:
    - assumptionId: as-baseline-mapping
      description: The level→policy mapping encoded in behavior.yaml is an informative hypothesis under
        test, not a normative rule.
      basis: 'model/behavior.yaml status: informative'
      validationStatus: Unvalidated
    scenarioConstraints:
    - constraintId: sc-baseline-sandbox
      description: L5 experimentation is sandboxed (assumption 7, load-bearing per F3) — experiments never
        perturb production.
    verificationTargets:
    - targetId: vt-baseline
      claimRef: sim-invariant:baseline
      criterionRef: invariant statement carried from model/behavior.yaml
      conditions: fast velocity, seed 2026, per-canvas defaults
    reproducibility:
      seed: 2026
      seedOrPolicyDeclared: true
    compatibility:
      outcome: CompatibleWithWarnings
      modelBaselineRef: aocl-sim 1.0.0
      notes: scenario semantics carried from an engine-specific implementation; Draft until canonicalized
    migrationNotes:
      hardCodedBehavior:
      - level→policy parameters (thresholds, gains, containment authority) are hard-coded in the sim engine
        and behavior.yaml — not yet canonical scenario parameters (§24)
      - event schedules (mode periods, novel rate) were engine-embedded — surfaced as disturbance profiles
      missingAttributes:
      - CR-008 verification claims/criteria behind the invariant targets (VER-011/012)
      - Observed/Estimated initial states distinct from the Actual plant state (SCN-011)
