      definition: External demand pattern, distinct from plant state.
    disturbances:
    - disturbanceId: d-stale-telemetry
      disturbanceType: DataQuality
      name: Stale telemetry
      definition: Observation freshness degraded.
      targetRefs:
      - sensor-latency-probe
      magnitude: 30 s
      magnitudeUnit: delay
      onset:
        basis: RelativeTime
        at: 0 s
      duration: scenario-long
      profile:
        kind: Step
      effect:
        variableRef: measured-latency
        effect: observations lag plant state
      knownToController: false
    events:
    - eventId: ev-start
      eventType: ScenarioStart
      name: Scenario starts
      trigger:
        basis: RelativeTime
        at: 0 s
      subjectRef: network-service
      ordering: Independent
    - eventId: ev-onset
      eventType: DisturbanceOnset
      name: Demand increases
      trigger:
        basis: RelativeTime
        at: 60 s
      subjectRef: network-service
