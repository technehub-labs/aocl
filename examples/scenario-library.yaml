    - eventId: ev-obs
      eventType: ObservationReceived
      name: Congestion observed
      trigger:
        basis: Event
        afterEventRef: ev-onset
      subjectRef: assurance-controller
      ordering: Ordered
      dependsOnRefs:
      - ev-onset
    - eventId: ev-verify
      eventType: VerificationCompleted
      name: Post-remediation verification
      trigger:
        basis: Condition
        conditionRef: after execution plus evaluation interval
      subjectRef: verification-path
      ordering: Conditional
      dependsOnRefs:
      - ev-obs
    assumptions:
    - assumptionId: as-topology
      description: Network topology unchanged during the scenario.
      basis: controlled test environment
      validationStatus: Validated
    scenarioConstraints:
    - constraintId: sc-max-duration
      description: Maximum simulated horizon 10 minutes.
    expectedObservations:
    - observationId: eo-latency-rise
      subjectRef: network-service
      expectation: latency rises above 50 ms after the demand spike
      kind: PlantCondition
    - observationId: eo-controller-view
      subjectRef: assurance-controller
      expectation: controller receives the delayed post-delay observation
      kind: ControllerVisible
    verificationTargets:
    - targetId: vt-detection
      claimRef: claim-detection
      criterionRef: crit-detection
      conditions: after the demand spike
      evaluationInterval: one observation cycle
    - targetId: vt-outcome
      claimRef: claim-c-latency-goal
      criterionRef: crit-latency
      conditions: post-remediation evaluation window
      requiredEvidence: independent measurement
    reproducibility:
      seed: 2026
      seedOrPolicyDeclared: true
    compatibility:
      outcome: Compatible
      modelBaselineRef: baseline-2026-11
    extends: SCN-NET-001
    differences:
    - controller-visible initial latency held at 42 ms while the plant moves to 72 ms
    - observation delay increased to 30 s
