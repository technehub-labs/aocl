<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#334155; stroke-width:1.2; }
    .grp5 { fill:#f5f3ff; stroke:#4c1d95; stroke-width:1.8; }
    .grp4 { fill:#faf5ff; stroke:#6d28d9; stroke-width:1.5; }
    .grp3 { fill:#fdfcff; stroke:#7c3aed; stroke-width:1.3; }
    .grp2 { fill:#fefefe; stroke:#8b5cf6; stroke-width:1.2; }
    .lbl { font-size:12px; fill:#1e293b; }
    .hd { font-size:13.5px; font-weight:bold; fill:#1e1b4b; }
    .flow { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arr3); }
    .front { font-size:11px; fill:#b45309; font-weight:bold; }
    .barrier { font-size:10px; fill:#64748b; }
  </style>

  <text x="450" y="24" text-anchor="middle" class="hd" fill="#4c1d95">Closed Loop Automation maturity — five levels, four frontiers (source §3.2–3.3)</text>

  <!-- L5 -->
  <rect class="grp5" x="310" y="44" width="280" height="64"/>
  <text x="450" y="64" text-anchor="middle" class="hd">L5 Pre-emptive</text>
  <text x="450" y="80" text-anchor="middle" class="lbl">autonomous goals · generative experimentation</text>
  <text x="450" y="96" text-anchor="middle" class="lbl">causal discovery · meta-learning · self-modification</text>

  <text x="612" y="118" class="front">Autonomy Frontier</text>
  <text x="612" y="132" class="barrier">digital twins, causal inference — barrier: delegating goal-setting</text>
  <path class="flow" d="M450 128 L450 108"/>

  <!-- L4 -->
  <rect class="grp4" x="310" y="170" width="280" height="64"/>
  <text x="450" y="190" text-anchor="middle" class="hd">L4 Predictive</text>
  <text x="450" y="206" text-anchor="middle" class="lbl">ML discovers patterns · generates own strategies</text>
  <text x="450" y="222" text-anchor="middle" class="lbl">learned baselines · causal root-cause · retraining pipelines</text>

  <text x="612" y="244" class="front">Cognition Frontier</text>
  <text x="612" y="258" class="barrier">MLOps, explainability — barriers: AI talent, non-stationarity</text>
  <path class="flow" d="M450 254 L450 234"/>

  <!-- L3 -->
  <rect class="grp3" x="310" y="296" width="280" height="60"/>
  <text x="450" y="316" text-anchor="middle" class="hd">L3 Proactive</text>
  <text x="450" y="332" text-anchor="middle" class="lbl">trend analysis · human-designed forecasts</text>
  <text x="450" y="348" text-anchor="middle" class="lbl">pre-emptive action before manifestation</text>

  <text x="612" y="366" class="front">Prediction Frontier</text>
  <text x="612" y="380" class="barrier">forecast models — barrier: data quality, feature engineering</text>
  <path class="flow" d="M450 376 L450 356"/>

  <!-- L2 -->
  <rect class="grp2" x="310" y="396" width="280" height="52"/>
  <text x="450" y="416" text-anchor="middle" class="hd">L2 Reactive</text>
  <text x="450" y="434" text-anchor="middle" class="lbl">threshold breach → predefined deterministic action</text>

  <text x="612" y="450" class="front">Automation Frontier</text>
  <text x="612" y="464" class="barrier">sensors, actuators, rule engines — barrier: organizational trust</text>
  <path class="flow" d="M450 470 L450 448"/>

  <!-- L1 -->
  <rect class="grp2" x="310" y="474" width="280" height="40"/>
  <text x="450" y="492" text-anchor="middle" class="hd">L1 Static</text>
  <text x="450" y="507" text-anchor="middle" class="lbl">manual configuration · informational monitoring only</text>

  <text x="80" y="300" class="lbl" fill="#475569">overall level =</text>
  <text x="80" y="316" class="lbl" fill="#475569">min(GD, DV, FI)</text>
  <text x="80" y="332" class="lbl" font-size="10" fill="#64748b">weakest of the three</text>
  <text x="80" y="346" class="lbl" font-size="10" fill="#64748b">assessment vectors</text>
</svg>
