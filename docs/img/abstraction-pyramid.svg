<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <style>
    .t { font-size:13.5px; font-weight:bold; fill:#4c1d95; }
    .tier { font-size:12px; font-weight:bold; fill:#ffffff; }
    .lbl { font-size:11px; fill:#1e293b; }
    .axis { font-size:10.5px; fill:#64748b; font-weight:bold; }
  </style>
  <text x="430" y="24" text-anchor="middle" class="t">The Abstraction Pyramid — what humans manage as maturity rises (source Fig. 13)</text>

  <!-- pyramid tiers (inverted: L5 on top) -->
  <polygon points="430,44 510,100 350,100" fill="#4c1d95"/>
  <text x="430" y="86" text-anchor="middle" class="tier">L5</text>
  <polygon points="345,108 515,108 560,164 300,164" fill="#6d28d9"/>
  <text x="430" y="140" text-anchor="middle" class="tier">L4</text>
  <polygon points="295,172 565,172 610,228 250,228" fill="#8b5cf6"/>
  <text x="430" y="204" text-anchor="middle" class="tier">L3</text>
  <polygon points="245,236 615,236 660,292 200,292" fill="#a78bfa"/>
  <text x="430" y="268" text-anchor="middle" class="tier" fill="#1e1b4b">L2</text>
  <polygon points="195,300 665,300 710,356 150,356" fill="#c4b5fd"/>
  <text x="430" y="332" text-anchor="middle" class="tier" fill="#1e1b4b">L1</text>

  <!-- right-side labels -->
  <text x="730" y="70" class="axis">governs system-proposed intents</text>
  <text x="730" y="140" class="axis">objectives &amp; constraints</text>
  <text x="730" y="204" class="axis">control policies</text>
  <text x="730" y="268" class="axis">parameters via playbooks</text>
  <text x="730" y="332" class="axis">individual parameters, manual</text>

  <!-- left-side dimension arrows -->
  <text x="30" y="70" class="axis">semantic ↑</text>
  <text x="30" y="140" class="axis">temporal ↑</text>
  <text x="30" y="204" class="axis">parameter ↑</text>
  <text x="30" y="380" class="lbl">rising maturity abstracts complexity upward: each tier delegates the tier below's details to the loop</text>
</svg>
