<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#334155; stroke-width:1.4; }
    .lane { fill:#f0fdf4; stroke:#16a34a; stroke-width:1.5; }
    .lbl { font-size:12px; fill:#1e293b; }
    .hd { font-size:12.5px; font-weight:bold; }
    .flow { stroke:#334155; stroke-width:1.3; fill:none; marker-end:url(#arrs); }
    .human { fill:#fffbeb; stroke:#f59e0b; stroke-width:1.4; }
  </style>
  <text x="450" y="22" text-anchor="middle" class="hd" fill="#166534">Slow Loop architecture — the primary output is policy, not commands (source Fig. 10)</text>

  <rect class="lane" x="70" y="50" width="760" height="120"/>
  <text x="450" y="72" text-anchor="middle" class="hd" fill="#166534">cycle time: minutes → months · multi-objective, strategic · human-reviewed</text>

  <rect class="box" x="90" y="92" width="160" height="52"/>
  <text x="170" y="113" text-anchor="middle" class="lbl" font-weight="bold">Aggregate</text>
  <text x="170" y="130" text-anchor="middle" class="lbl" font-size="10" fill="#64748b">multi-source telemetry, events</text>

  <rect class="box" x="300" y="92" width="170" height="52"/>
  <text x="385" y="113" text-anchor="middle" class="lbl" font-weight="bold">Deep analysis</text>
  <text x="385" y="130" text-anchor="middle" class="lbl" font-size="10" fill="#64748b">AI/ML · digital twins · causal inference</text>

  <rect class="box" x="520" y="92" width="150" height="52"/>
  <text x="595" y="113" text-anchor="middle" class="lbl" font-weight="bold">Strategic output</text>
  <text x="595" y="130" text-anchor="middle" class="lbl" font-size="10" fill="#64748b">policy · constraint · model update</text>

  <rect class="human" x="710" y="92" width="100" height="52"/>
  <text x="760" y="113" text-anchor="middle" class="lbl" font-weight="bold">Human review</text>
  <text x="760" y="130" text-anchor="middle" class="lbl" font-size="10" fill="#92400e">approval gate</text>

  <path class="flow" d="M250 118 L300 118"/>
  <path class="flow" d="M470 118 L520 118"/>
  <path class="flow" d="M670 118 L710 118"/>
  <path class="flow" d="M170 144 L170 210 L385 210 L385 144" stroke-dasharray="5 3"/>
  <text x="405" y="246" text-anchor="middle" class="lbl" fill="#475569">examples: capacity planning · CEM policy · zero-trust governance · pricing &amp; bundling</text>
</svg>
