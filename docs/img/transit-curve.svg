<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <style>
    .t { font-size:13.5px; font-weight:bold; fill:#4c1d95; }
    .lbl { font-size:11.5px; fill:#1e293b; }
    .small { font-size:10px; fill:#64748b; }
    .axis { stroke:#334155; stroke-width:1.3; }
  </style>
  <text x="450" y="24" text-anchor="middle" class="t">Non-linear value realization — logarithmic (L1–L3) inflecting to exponential (L3–L5) (source Fig. 8)</text>

  <!-- plot area -->
  <rect x="90" y="50" width="740" height="220" fill="#fafafa" stroke="#e2e8f0"/>
  <!-- log curve L1-L3: value = ln(1+L)/ln(6)  (L: 1..3 -> 0.386..0.776) -->
  <path d="M 90 241.7 L 237.5 215.2 L 385 186.7 L 470 168.5" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <!-- exp curve L3-L5: value = exp(L-3) (L3=1 -> 1.0.. at L5=7.39 -> clip 220 area => y) -->
  <path d="M 470 168.5 L 545 141 L 620 104 L 695 50" fill="none" stroke="#16a34a" stroke-width="2.4"/>
  <!-- inflection -->
  <line x1="470" y1="50" x2="470" y2="270" stroke="#f59e0b" stroke-dasharray="5 4" stroke-width="1.6"/>
  <text x="480" y="64" class="small" fill="#b45309" font-weight="bold">L3–L4 boundary: human-designed → machine-discovered control</text>

  <!-- axes -->
  <line class="axis" x1="90" y1="270" x2="830" y2="270"/>
  <line class="axis" x1="90" y1="270" x2="90" y2="50"/>
  <text x="460" y="292" text-anchor="middle" class="lbl">maturity level</text>
  <text x="60" y="160" text-anchor="middle" class="lbl" transform="rotate(-90 60 160)">realized value (normalized)</text>

  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="90" y="286">L1</text><text x="237" y="286">L2</text><text x="385" y="286">L3</text><text x="532" y="286">L4</text><text x="680" y="286">L5</text>
  </g>
  <g font-size="9.5" fill="#94a3b8" text-anchor="middle">
    <text x="90" y="298">Static</text><text x="237" y="298">Reactive</text><text x="385" y="298">Proactive</text><text x="532" y="298">Predictive</text><text x="680" y="298">Pre-emptive</text>
  </g>

  <text x="180" y="130" class="small" fill="#2563eb">ln(1+αL)/ln(1+α·5) — dramatic early gains,</text>
  <text x="180" y="144" class="small" fill="#2563eb">incremental returns by L3</text>
  <text x="640" y="240" class="small" fill="#16a34a">exp(β(L−3)) — compounding learning,</text>
  <text x="640" y="254" class="small" fill="#16a34a">cross-loop network effects</text>
  <text x="450" y="318" text-anchor="middle" class="small">effort asymmetry: E_f = e^R — L4→L5 doubles complexity (1.5→3.5) for ~7× the effort (5.47→37.6)</text>
</svg>
