<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <style>
    .t { font-size:13.5px; font-weight:bold; fill:#4c1d95; }
    .lbl { font-size:12px; fill:#1e293b; }
    .small { font-size:10.5px; fill:#64748b; }
    .formula { font-size:16px; font-weight:bold; fill:#1e1b4b; }
  </style>
  <defs>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <text x="450" y="24" text-anchor="middle" class="t">The realization wedge — value grows only with BOTH experience and complexity (source Fig. 7)</text>

  <!-- Intent bracket = K -->
  <text x="120" y="80" text-anchor="middle" class="lbl" fill="#dc2626" font-weight="bold">Intent / Goals /</text>
  <text x="120" y="98" text-anchor="middle" class="lbl" fill="#dc2626" font-weight="bold">Requirements /</text>
  <text x="120" y="116" text-anchor="middle" class="lbl" fill="#dc2626" font-weight="bold">Expectations = K</text>
  <text x="120" y="136" text-anchor="middle" class="small">(the invariant purpose —</text>
  <text x="120" y="150" text-anchor="middle" class="small">the reference axis, not a term)</text>

  <!-- wedge -->
  <polygon points="250,300 850,120 850,300" fill="url(#wedge)"/>
  <text x="560" y="216" text-anchor="middle" class="formula" fill="#ffffff">R = √( experience² + (complexity · V_d)² )</text>
  <text x="556" y="290" text-anchor="middle" class="lbl" fill="#f5f3ff">experience — the grounded foundation for evolution (E = 1 − T_manual/T_total)</text>
  <text x="700" y="140" text-anchor="middle" class="small" fill="#ffffff">complexity &amp; sophistication (C)</text>

  <!-- L1..L5 base -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="250" y="306" width="120" height="30" fill="#ede9fe" stroke="#a78bfa"/><text x="310" y="326" fill="#4c1d95">L1</text>
    <rect x="370" y="306" width="120" height="30" fill="#ddd6fe" stroke="#a78bfa"/><text x="430" y="326" fill="#4c1d95">L2</text>
    <rect x="490" y="306" width="120" height="30" fill="#c4b5fd" stroke="#7c3aed"/><text x="550" y="326" fill="#4c1d95">L3</text>
    <rect x="610" y="306" width="120" height="30" fill="#8b5cf6" stroke="#6d28d9"/><text x="670" y="326" fill="#ffffff">L4</text>
    <rect x="730" y="306" width="120" height="30" fill="#5b21b6" stroke="#4c1d95"/><text x="790" y="326" fill="#ffffff">L5</text>
  </g>

  <text x="450" y="364" text-anchor="middle" class="lbl" fill="#475569">Realization of the loop's purpose requires progressively higher experience AND complexity at each level.</text>
</svg>
